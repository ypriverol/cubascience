name: Deploy GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r science/requirements.txt
          pip install -r demographics/requirements.txt
          pip install nbconvert

      - name: Build site
        run: |
          mkdir -p site/science site/demographics
          cp index.html site/index.html
          # Convert without re-execution so Pages stays fast and deterministic.
          jupyter nbconvert science/ciencia.ipynb \
            --to html --output-dir site/science --output index
          jupyter nbconvert demographics/demographics.ipynb \
            --to html --output-dir site/demographics --output index
          mkdir -p site/demographics/figures site/science/data site/science/images
          cp -R demographics/figures/. site/demographics/figures/ || true
          cp -R science/data/. site/science/data/ || true
          cp -R science/images/. site/science/images/ || true
          # Avoid Jekyll ignoring paths with underscores on classic Pages
          touch site/.nojekyll

      # Publish to gh-pages (this repo's Pages environment allows that branch).
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
