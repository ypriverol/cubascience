# Canonical quantitative claims for Cuba demographics 2021–2026.
# Monte Carlo window: end-2021 → end-2025 (+ end-2026 nowcast).
# All public products (EN paper, ES essay, social IG, notebook) must use these definitions.
# After 2026-07-31 adversarial review: A–D are scenarios; D is illustrative central path.

meta:
  version: "2026-07-31"
  preferred_model: D
  preferred_model_role: "illustrative central scenario (not an identified estimator)"
  mc_window: "end-2021 → end-2025"
  mc_draws_paper: 1000000
  mc_draws_notebook_interactive: 100000
  deaths_2023_canonical: 117739
  deaths_2023_anuario_footnote: 117746
  script: "scripts/model_from_2021.py"
  primary_uncertainty: "across-scenario envelope A–C/D (~1.8–2.4M loss), not within-D percentiles"

vital:
  official_pop_2019: 11193470
  official_pop_end_2021: 11113215
  onei_pop_end_2025: 9434593
  births_2025: 68064
  deaths_2025: 136214
  natural_balance_2025: -68149
  tfr_2025: 1.29
  births_2022_2025: 325233
  deaths_2022_2025_registered: 502149
  onei_net_mig_2022_2025: 1501706
  # legacy full-crisis totals retained for excess-mortality context
  births_2020_2025: 529367
  deaths_2020_2025_registered: 782233
  onei_net_mig_2020_2025: 1516491

model_d:
  pop_end_2025_m: 8.59
  loss_2021_2025_m: 2.21
  loss_pct_corrected_base: 20.5
  loss_90_m: [1.84, 2.60]
  loss_90_note: "Prior-predictive under fixed Model D margins — not sampling error from data."
  pop_end_2026_m: 8.29
  loss_during_2026_approx: 300000
  migration_share_of_loss_pct: 91.0
  definition_loss_pct: "Percent decline uses corrected end-2021 base (official minus baseline overstatement U0), not raw official 11.11M."
  onei_anchored_M1_note: "If M=1 (ONEI R only) and U0 modest, living population sits nearer ~9.0–9.2M (Model A neighbourhood)."

headline_rules:
  primary_scientific:
    value_approx: "about 1 in 5"
    pct_approx: 20.5
    base: "corrected / Model D scenario"
    year: 2025
    products: [en_paper, notebook]
  register_gap_official_2021_to_end_2026:
    value_approx: "about 1 in 4"
    pct_approx: 25
    loss_m_approx: 2.82
    base: "official 2021 (11.11M)"
    year: 2026
    years_span: 5
    social_allowed: true
    scientific_lead: false
    note: "Register gap vs official 2021 stock — not interchangeable with Model D −20.5%. Do not lead the scientific abstract with this figure."

excess_mortality:
  provisional_schedule_residual_2024_2025:
    point_illustrative: 38000
    band_low: 30000
    band_high: 60000
    status: "provisional / not fully computed from ONEI 3.15"
    method: "Illustrative registered minus provisional 2019-schedule expected deaths (figure inputs); pending reproducible age–sex pipeline."
    products: [en_paper, es_essay, social, notebook]
    note: "Do not call this a Kitagawa decomposition or the primary scientific claim. Primary headcount uncertainty remains the migration scenario envelope."
  secondary_crude_registered_2020_2025: 153000
  secondary_crude_registered_2024_2025: 66000
  note: "Always label crude vs schedule residual. Windows differ (2020–2025 vs 2024–2025)."

selectivity:
  emigrants_age_15_59_pct: 77
  median_age_leavers: 30
  median_age_stayers: 45
  pct_age_60_plus_remaining: 26.7
  pct_age_60_plus_note: "26.7% is official structure; Model-D-consistent share would be higher — treat as official, not D-consistent."

models_summary:
  - id: A
    label: "A · conservative"
    assumption: "ONEI-anchored"
    role: scenario
    decline_m: 1.80
    decline_pct: 16.4
    pop_end_2025_m: 9.16
  - id: B
    label: "B · crisis-adjusted"
    assumption: "under-registration + independent emigration"
    role: scenario
    decline_m: 2.19
    decline_pct: 20.4
    pop_end_2025_m: 8.57
  - id: C
    label: "C · worst case"
    assumption: "analog-calibrated upper bound"
    role: scenario
    decline_m: 2.41
    decline_pct: 22.6
    pop_end_2025_m: 8.26
  - id: D
    label: "D · sentinel"
    assumption: "IMR consistency check + migration priors near B"
    role: "illustrative central scenario"
    decline_m: 2.21
    decline_pct: 20.5
    pop_end_2025_m: 8.59
    preferred: true
  - id: E
    label: "E · vital reconstruction (HSDS)"
    assumption: "ageing + health decadence + bad reporting → B*, D*, P*"
    role: "provisional companion"
    decline_m: 2.13
    decline_pct: 19.2
    pop_end_2025_m: 8.96
    preferred: false
    provisional: true

model_e:
  pop_end_2025_m: 8.96
  loss_2021_2025_m: 2.13
  loss_pct_corrected_base: 19.2
  loss_90_m: [1.90, 2.44]
  pop_end_2026_m: 8.66
  migration_share_of_loss_pct: 87.8
  natural_decrease_share_of_loss_pct: 12.2
  promote: false
  u0_prior_differs_from_d: true
  definition: "Vital reconstruction via HSDS; provisional. Higher stock vs D is partly a different U0 prior — not independent confirmation."
  adversarial_gate: "artifacts/model_e_adversarial_notes.md"
  script: "scripts/hsds_population.py"

triangulation:
  band_low_m: 8.0
  band_high_m: 8.9
  note: "Model D is the study estimand and must not appear as external validation of itself. Albizu/housing share exit-correcting assumptions with the migration narrative — soft independence only."
  sources:
    - {source: "UN (stale migration)", estimate: 10.90, role: ceiling}
    - {source: "MINSAP denominator", estimate: 10.24, role: ceiling}
    - {source: "Electoral roll (level)", estimate: 10.00, role: ceiling}
    - {source: "ONEI official", estimate: 9.43, role: official}
    - {source: "Housing × occupancy", estimate: 8.70, role: occupancy_fragile}
    - {source: "Albizu-Campos (2023)", estimate: 8.62, role: independent_shared_assumptions}
    - {source: "This study (Model D scenario)", estimate: 8.59, role: estimand_not_validator}
    - {source: "Albizu-Campos (2024)", estimate: 8.03, role: independent_shared_assumptions}

# Settled ledger: US + non_US = floor. Breakdown of non_US must sum to non_us_total.
destinations_settled:
  us: 800000
  non_us_total: 250000
  spain: 135000
  uruguay: 35000
  rest: 80000
  floor_total: 1050000
  assert_sum: "us + non_us_total == floor_total; spain + uruguay + rest == non_us_total"
  us_construction_note: "Admin-status / CBP-pipeline settled approximation — not ACS Cuban-born stock. ACS rise 2019→2024 is smaller (~+0.34M); treat 0.80M as an administrative ceiling/floor hybrid."
  note: "Settled-concept floor only — not encounters or nationality applications. Mostly 2020–2025 exits. Periods misalign with ONEI R (2022–2025)."

destinations_other_concepts:
  us_encounters_2022_2024_approx: 850000
  us_acs_cuban_born_rise_2019_2024_approx: 335000
  spain_nationality_applications_approx: 300000
  note: "Do not mix with settled ledger without labeling. Encounters ≈ events; ACS ≈ stock change; admin settled ≈ statuses."

migration_bridge:
  settled_floor_m: 1.05
  onei_R_m: 1.50
  albizu_net_m: 1.8
  model_d_median_Rm_m: 2.0
  note: "Only the floor is ledger-like. 1.05→1.5 is an unquantified residual; 1.5→2.0 is Model D prior M on R, not destination microdata."
  u0_M_budget_note: "U0 and (M-1)R can double-count the same register lag; report ONEI-anchored (M≈1) beside D."
